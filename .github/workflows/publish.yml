name: Publish images

on:
  push:
    branches: [main, dev]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: orchestrator
            file: Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: orchestrator-agent
            file: Dockerfile.agent
            platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then v="${{ github.ref_name }}"
          elif [ "${{ github.ref_name }}" = dev ]; then v="dev-${GITHUB_SHA::7}"
          else v="${GITHUB_SHA::7}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            # main is the stable channel; "latest" stays an alias of it so existing installs keep updating.
            type=raw,value=stable,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=sha,prefix=sha-
            type=ref,event=tag
          # metadata-action would otherwise label the image with its tag ("latest").
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
