# Runs the control plane. Open http://localhost:8080 and sign in with the admin token
# printed in the logs on first start (docker compose logs orchestrator), or set ORCH_ADMIN_TOKEN.
services:
  orchestrator:
    build: .
    image: ghcr.io/maffewem/orchestrator:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - orchestrator-data:/data
      # Lets the dashboard update the server (it swaps its own container). This gives the
      # container control of Docker on this host. Set DOCKER_GID to the output of
      # `stat -c %g /var/run/docker.sock`. To opt out, delete this line and group_add.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    # environment:
    #   ORCH_ADMIN_TOKEN: change-me

volumes:
  orchestrator-data:
